<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanobot Swarm Controller | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #14b8a6; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #14b8a6; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #0d9488, #0f766e); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #14b8a6; transform: translateY(-2px); box-shadow: 0 0 15px rgba(20, 184, 166, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: #450a0a; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; filter: contrast(1.2); }
      
      .hud { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #14b8a6; width: 250px; z-index: 10; pointer-events: none; }
      .hud h3 { margin: 0 0 10px 0; color: #14b8a6; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-virus { color: #facc15; }
      .val-healthy { color: #ef4444; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-spider"></i> Nanobot Phagocyte Swarm</h2>
          <p>Hunt mutating pathogens inside the bloodstream</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="injectNanobots()"><i class="fas fa-syringe"></i> Inject Nanobot Swarm</button>
        </div>
      </div>
      
      <div class="sim-container">
        <!-- Bloodstream flowing background -->
        <div style="position: absolute; inset:0; background: url('https://images.unsplash.com/photo-1579154204601-01588f351e67?q=80&w=2670&auto=format&fit=crop') center/cover; opacity: 0.2; pointer-events: none; mix-blend-mode: color-dodge;"></div>
        
        <canvas id="bloodCanvas" style="position: relative; z-index: 1;"></canvas>
        <div class="hud">
          <h3>Patient Telemetry</h3>
          <div class="metric"><span>Viral Load:</span> <span class="val val-virus" id="virusVal">0</span></div>
          <div class="metric"><span>Healthy Cells Destroyed:</span> <span class="val val-healthy" id="casVal">0</span></div>
          <div class="metric"><span>Nanobots Active:</span> <span class="val" id="botVal" style="color:#5eead4">0</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>Immune Status:</span> <span class="val" id="statusVal" style="color:#ef4444">CRITICAL</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// Nanobot Swarm Targeting AI (Boids Flocking + Seek)
// Write logic to guide the nanobot.
// Avoid red blood cells. Hunt and destroy the yellow super-virus!

function getNanobotAcceleration(bot, viruses, bloodCells) {
    let ax = 0;
    let ay = 0;
    
    // Seek nearest virus
    if (viruses.length > 0) {
        let nearest = viruses[0]; // naive targeting
        let dx = nearest.x - bot.x;
        let dy = nearest.y - bot.y;
        let dist = Math.hypot(dx, dy);
        
        if (dist > 0) {
            ax += (dx / dist) * 0.5;
            ay += (dy / dist) * 0.5;
        }
    }
    
    return { ax, ay };
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      const canvas = document.getElementById('bloodCanvas');
      const ctx = canvas.getContext('2d');
      
      let isSimulating = false;
      let nanobots = [];
      let viruses = [];
      let bloodCells = [];
      let casualties = 0;
      
      function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
      window.addEventListener('resize', resize);
      resize();

      function initPathogens() {
          viruses = [];
          for(let i=0; i<30; i++) {
              viruses.push({
                  x: Math.random() * canvas.width,
                  y: Math.random() * canvas.height,
                  vx: (Math.random() - 0.5) * 2,
                  vy: (Math.random() - 0.5) * 2
              });
          }
          bloodCells = [];
          for(let i=0; i<100; i++) {
              bloodCells.push({
                  x: Math.random() * canvas.width,
                  y: Math.random() * canvas.height,
                  vx: (Math.random() - 0.5) * 1,
                  vy: (Math.random() - 0.5) * 1
              });
          }
      }
      initPathogens();

      function animate() {
        // Reddish motion blur
        ctx.fillStyle = 'rgba(69, 10, 10, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Fluid flow force
        let flowVx = 0.5;
        
        // Update Blood Cells
        ctx.fillStyle = 'rgba(239, 68, 68, 0.6)';
        for(let i=0; i<bloodCells.length; i++) {
            let b = bloodCells[i];
            b.x += b.vx + flowVx;
            b.y += b.vy;
            if(b.x > canvas.width + 20) b.x = -20;
            if(b.y < -20) b.y = canvas.height + 20;
            if(b.y > canvas.height + 20) b.y = -20;
            
            ctx.beginPath();
            ctx.arc(b.x, b.y, 12, 0, Math.PI*2);
            ctx.fill();
            // Donut hole for RBC look
            ctx.fillStyle = 'rgba(153, 27, 27, 0.8)';
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'rgba(239, 68, 68, 0.6)'; // restore
        }
        
        // Update Viruses
        if(Math.random() < 0.02 && viruses.length < 50 && viruses.length > 0) {
            // Virus replicates!
            viruses.push({
                x: viruses[0].x + (Math.random()-0.5)*20,
                y: viruses[0].y + (Math.random()-0.5)*20,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2
            });
        }
        
        for(let i=0; i<viruses.length; i++) {
            let v = viruses[i];
            v.x += v.vx + flowVx;
            v.y += v.vy;
            
            // Jitter
            v.x += (Math.random() - 0.5) * 3;
            v.y += (Math.random() - 0.5) * 3;
            
            if(v.x > canvas.width + 20) v.x = -20;
            if(v.y < -20) v.y = canvas.height + 20;
            if(v.y > canvas.height + 20) v.y = -20;
            
            ctx.beginPath();
            // Spiky virus
            for(let a=0; a<Math.PI*2; a+=0.5) {
                let d = 8 + (Math.random()*4);
                ctx.lineTo(v.x + Math.cos(a)*d, v.y + Math.sin(a)*d);
            }
            ctx.fillStyle = '#facc15';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#facc15';
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Update Nanobots
        if(isSimulating) {
            for(let i = nanobots.length - 1; i >= 0; i--) {
                let n = nanobots[i];
                
                try {
                    eval(editor.getValue());
                    let acc = getNanobotAcceleration(n, viruses, bloodCells);
                    if(acc) {
                        n.vx += acc.ax || 0;
                        n.vy += acc.ay || 0;
                    }
                } catch(e) {}
                
                // Friction / max speed
                let speed = Math.hypot(n.vx, n.vy);
                if(speed > 4) {
                    n.vx = (n.vx / speed) * 4;
                    n.vy = (n.vy / speed) * 4;
                }
                
                n.x += n.vx + flowVx;
                n.y += n.vy;
                
                if(n.x > canvas.width + 20) n.x = -20;
                if(n.x < -20) n.x = canvas.width + 20;
                if(n.y < -20) n.y = canvas.height + 20;
                if(n.y > canvas.height + 20) n.y = -20;
                
                // Draw Nanobot
                ctx.beginPath();
                ctx.moveTo(n.x + Math.cos(Math.atan2(n.vy, n.vx))*6, n.y + Math.sin(Math.atan2(n.vy, n.vx))*6);
                ctx.lineTo(n.x + Math.cos(Math.atan2(n.vy, n.vx) + 2.5)*5, n.y + Math.sin(Math.atan2(n.vy, n.vx) + 2.5)*5);
                ctx.lineTo(n.x + Math.cos(Math.atan2(n.vy, n.vx) - 2.5)*5, n.y + Math.sin(Math.atan2(n.vy, n.vx) - 2.5)*5);
                ctx.fillStyle = '#5eead4';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#5eead4';
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Collisions (Destroy Virus)
                for(let j = viruses.length - 1; j >= 0; j--) {
                    if(Math.hypot(n.x - viruses[j].x, n.y - viruses[j].y) < 12) {
                        viruses.splice(j, 1);
                        
                        // Blast effect
                        ctx.beginPath();
                        ctx.arc(n.x, n.y, 20, 0, Math.PI*2);
                        ctx.fillStyle = 'rgba(94, 234, 212, 0.5)';
                        ctx.fill();
                        break;
                    }
                }
                
                // Collisions (Destroy RBC by accident!)
                for(let j = bloodCells.length - 1; j >= 0; j--) {
                    if(Math.hypot(n.x - bloodCells[j].x, n.y - bloodCells[j].y) < 12) {
                        bloodCells.splice(j, 1);
                        casualties++;
                        break;
                    }
                }
            }
        }

        // HUD Updates
        document.getElementById('virusVal').innerText = viruses.length;
        document.getElementById('casVal').innerText = casualties;
        document.getElementById('botVal').innerText = nanobots.length;
        
        if (viruses.length === 0 && isSimulating) {
            document.getElementById('statusVal').innerText = "INFECTION CLEARED";
            document.getElementById('statusVal').style.color = "#10b981";
            isSimulating = false;
        } else if (casualties > 20) {
            document.getElementById('statusVal').innerText = "AUTO-IMMUNE FAILURE";
            document.getElementById('statusVal').style.color = "#ef4444";
            isSimulating = false; // abort!
            nanobots = [];
        }

        requestAnimationFrame(animate);
      }
      animate();

      function injectNanobots() {
         nanobots = [];
         for(let i=0; i<80; i++) {
             nanobots.push({
                 x: -20,
                 y: (canvas.height/2) + (Math.random()-0.5)*100,
                 vx: 5 + Math.random()*2,
                 vy: (Math.random()-0.5) * 2
             });
         }
         isSimulating = true;
         document.getElementById('statusVal').innerText = "SWARM ENGAGED";
         document.getElementById('statusVal').style.color = "#5eead4";
      }
    </script>
  </body>
</html>
